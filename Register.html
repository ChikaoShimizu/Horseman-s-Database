<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - UP Shops</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center py-10">
    
    <div id="app" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#5c2e91] mb-2">สมัครสมาชิก</h1>
            <p class="text-slate-500">เข้าร่วมชุมชน UP Shops</p>
        </div>

        <!-- Role Selection -->
        <div class="flex gap-4 mb-6">
            <button @click="role = 'user'" :class="role === 'user' ? 'bg-purple-100 border-[#5c2e91] text-[#5c2e91]' : 'border-slate-200 text-slate-500'" class="flex-1 py-3 border-2 rounded-xl font-medium transition flex flex-col items-center gap-2">
                <i class="fa-solid fa-user-graduate text-xl"></i>
                นิสิต / ผู้ใช้ทั่วไป
            </button>
            <button @click="role = 'owner'" :class="role === 'owner' ? 'bg-yellow-50 border-[#f1c40f] text-yellow-700' : 'border-slate-200 text-slate-500'" class="flex-1 py-3 border-2 rounded-xl font-medium transition flex flex-col items-center gap-2">
                <i class="fa-solid fa-store text-xl"></i>
                เจ้าของร้านค้า
            </button>
        </div>

        <form @submit.prevent="handleRegister" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ - นามสกุล</label>
                <input v-model="form.name" type="text" required placeholder="สมชาย ใจดี" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#5c2e91]">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">อีเมล</label>
                <input v-model="form.email" type="email" required placeholder="example@up.ac.th" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#5c2e91]">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                <input v-model="form.password" type="password" required placeholder="••••••••" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#5c2e91]">
            </div>

            <button type="submit" class="w-full bg-[#5c2e91] hover:bg-purple-800 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md mt-4">
                ยืนยันการสมัคร
            </button>
        </form>

        <div class="text-center mt-6 text-sm text-slate-500">
            มีบัญชีอยู่แล้ว? <a href="login.html" class="text-[#5c2e91] font-bold hover:underline">เข้าสู่ระบบ</a>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive } = Vue;
        createApp({
            setup() {
                const role = ref('user');
                const form = reactive({ name: '', email: '', password: '' });

                const handleRegister = () => {
                    alert(`จำลองการสมัครสำเร็จ!\nชื่อ: ${form.name}\nสิทธิ์: ${role.value}`);
                    window.location.href = 'login.html';
                };

                return { role, form, handleRegister }
            }
        }).mount('#app');
    </script>
</body>
</html>
