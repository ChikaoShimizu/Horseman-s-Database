<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - UP Shops</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center">
    
    <div id="app" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#5c2e91] mb-2">UP Shops</h1>
            <p class="text-slate-500">เข้าสู่ระบบเพื่อจัดการร้านค้าของคุณ</p>
        </div>

        <!-- แจ้งเตือนเมื่อกรอกข้อมูลไม่ครบ -->
        <div v-if="errorMessage" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm flex items-center">
            <i class="fa-solid fa-circle-exclamation mr-2"></i> {{ errorMessage }}
        </div>

        <form @submit.prevent="handleLogin" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">อีเมล (Email)</label>
                <!-- ใช้ v-model ผูกค่ากับตัวแปร email -->
                <input v-model="email" type="email" placeholder="example@up.ac.th" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#5c2e91]">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <!-- ใช้ v-model ผูกค่ากับตัวแปร password -->
                    <input v-model="password" :type="showPassword ? 'text' : 'password'" placeholder="••••••••" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#5c2e91] pr-12">
                    
                    <button type="button" @click="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-[#5c2e91] focus:outline-none transition">
                        <i :class="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-[#5c2e91] hover:bg-purple-800 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <script>
        const { createApp, ref } = Vue;

// 1. เพิ่มการเชื่อมต่อ Supabase (ใช้ Key เดียวกับ Register.html)
const supabaseUrl = 'https://kmebinvqehwomycufvlj.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttZWJpbnZxZWh3b215Y3VmdmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDc5ODMsImV4cCI6MjEwMjc4Mzk4M30.TWGUBnYcoBovJ34q1hhV-yJ8vV-e2sG3tECXOH-HEs4';
const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

createApp({
    setup() {
        const showPassword = ref(false);
        const email = ref('');
        const password = ref('');
        const errorMessage = ref('');

        const togglePassword = () => {
            showPassword.value = !showPassword.value;
        };

        // 2. เปลี่ยนเป็น async function และเช็คกับ Supabase Auth
        const handleLogin = async () => {
            errorMessage.value = '';

            // ตรวจสอบการเว้นว่าง
            if (!email.value || !password.value) {
                errorMessage.value = 'กรุณากรอกข้อมูลให้ครบถ้วน';
                return;
            }

            try {
                // ส่งข้อมูลไปยืนยันกับ Supabase
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email.value,
                    password: password.value,
                });

                // ตรวจสอบ Error
                if (error) {
                    if (error.message.includes('Invalid login credentials')) {
                        errorMessage.value = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
                    } else {
                        errorMessage.value = 'เกิดข้อผิดพลาด: ' + error.message;
                    }
                    return;
                }

                // กรณีเข้าสู่ระบบสำเร็จ
                if (data.user) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', data.user.email);
                    
                    const userRole = data.user.user_metadata?.role || 'user';
                    localStorage.setItem('userRole', userRole);

                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.error(err);
                errorMessage.value = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
            }
        };

        return {
            showPassword,
            email,
            password,
            errorMessage,
            togglePassword,
            handleLogin
        }
    }
}).mount('#app');
    </script>
    </body>
    </html>
