<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการร้านค้า - UP Shops</title>
    
    <!-- โหลด Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- โหลด Leaflet CSS & JS สำหรับแผนที่จริง (ฟรี ไม่ต้องใช้ API Key) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- โหลด Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- นำไปวางต่อจาก <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

<div id="app">
    <!-- Navbar (แบบย่อสำหรับหน้าจัดการ) -->
    <nav class="bg-[#5c2e91] text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center font-bold text-lg">
                <i class="fa-solid fa-shop mr-2 text-[#f1c40f]"></i>
                ระบบจัดการโปรไฟล์ร้านค้า
            </div>
            <a href="index.html" class="text-white hover:text-gray-200 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> กลับหน้าหลัก
            </a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        
        <!-- กล่องแสดงข้อความ Error (Edge Cases) -->
        <div v-if="errorMessage" class="mb-6 p-4 bg-red-100 border-l-4 border-red-500 text-red-700 rounded-r-lg shadow-sm flex items-start">
            <i class="fa-solid fa-triangle-exclamation mt-1 mr-3 text-lg"></i>
            <div>
                <h3 class="font-bold">พบข้อผิดพลาด</h3>
                <p class="text-sm">{{ errorMessage }}</p>
            </div>
        </div>

        <!-- กล่องแสดงข้อความสำเร็จ (Happy Path) -->
        <div v-if="successMessage" class="mb-6 p-4 bg-green-100 border-l-4 border-green-500 text-green-700 rounded-r-lg shadow-sm flex items-start">
            <i class="fa-solid fa-circle-check mt-1 mr-3 text-lg"></i>
            <div>
                <h3 class="font-bold">สำเร็จ!</h3>
                <p class="text-sm">{{ successMessage }}</p>
            </div>
        </div>

        <form @submit.prevent="saveShopProfile" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            
            <!-- ส่วนที่ 1: ข้อมูลพื้นฐาน (User Story 2.1) -->
            <div class="p-6 md:p-8 border-b border-slate-200">
                <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center">
                    <span class="bg-purple-100 text-[#5c2e91] w-8 h-8 rounded-full flex items-center justify-center mr-3 text-sm">1</span>
                    ข้อมูลพื้นฐาน
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อร้านค้า <span class="text-red-500">*</span></label>
                        <input v-model="shop.name" type="text" placeholder="เช่น ป้าศรี ตามสั่ง" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">หมวดหมู่ <span class="text-red-500">*</span></label>
                        <select v-model="shop.category" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                            <option value="" disabled>-- เลือกหมวดหมู่ --</option>
                            <option value="อาหาร">อาหาร</option>
                            <option value="คาเฟ่">คาเฟ่</option>
                            <option value="ซักรีด">ซักรีด</option>
                            <option value="หอพัก">หอพัก</option>
                            <option value="ซ่อมรถ">ซ่อมรถ</option>
                        </select>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-1">คำอธิบายร้าน / เมนูแนะนำ</label>
                    <textarea v-model="shop.description" rows="3" placeholder="อธิบายจุดเด่นของร้าน..." class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">เวลาเปิด <span class="text-red-500">*</span></label>
                        <input v-model="shop.openTime" type="time" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">เวลาปิด <span class="text-red-500">*</span></label>
                        <input v-model="shop.closeTime" type="time" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 2: พิกัดแผนที่ (User Story 2.2) -->
            <div class="p-6 md:p-8 bg-slate-50">
                <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center">
                    <span class="bg-purple-100 text-[#5c2e91] w-8 h-8 rounded-full flex items-center justify-center mr-3 text-sm">2</span>
                    ตำแหน่งที่ตั้ง (ปักหมุด)
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- แผนที่จริง -->
                    <div class="md:col-span-2 relative border border-slate-300 rounded-xl overflow-hidden h-64 z-10">
                        <!-- กล่องนี้จะถูก Leaflet นำแผนที่มาวาดใส่ -->
                        <div id="map" class="w-full h-full"></div>
                    </div>

                    <!-- ค่าพิกัด -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">ละติจูด (Latitude)</label>
                            <!-- เปลี่ยนเป็น @input -->
                            <input v-model="shop.lat" type="number" step="any" placeholder="เช่น 19.0284" class="w-full p-3 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">ลองจิจูด (Longitude)</label>
                            <!-- เปลี่ยนเป็น @input -->
                            <input v-model="shop.lng" type="number" step="any" placeholder="เช่น 99.8941" class="w-full p-3 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                        </div>
                        <div class="text-xs text-slate-500 mt-2">
                            <i class="fa-solid fa-circle-info mr-1"></i> สามารถคลิกบนแผนที่ หรือพิมพ์ตัวเลขพิกัดเองได้
                        </div>
                    </div>
                </div>
            </div>

            <!-- ปุ่ม Submit -->
            <div class="p-6 border-t border-slate-200 bg-white flex justify-end">
                <button type="submit" class="bg-[#5c2e91] hover:bg-purple-800 text-white font-bold py-3 px-8 rounded-lg shadow-md transition duration-200 flex items-center">
                    <i class="fa-solid fa-save mr-2"></i> บันทึกข้อมูลร้านค้า
                </button>
            </div>
            
        </form>
    </main>
</div>

<script>
    // เพิ่ม watch เข้ามาตรงนี้
    // ดึง Key มาจากหน้า login.html ของคุณ
    const supabaseUrl = 'https://kmebinvqehwomycufvlj.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttZWJpbnZxZWh3b215Y3VmdmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDc5ODMsImV4cCI6MjEwMjc4Mzk4M30.TWGUBnYcoBovJ34q1hhV-yJ8vV-e2sG3tECXOH-HEs4';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    const { createApp, reactive, ref, onMounted, watch } = Vue; 

    createApp({
        setup() {
            const shop = reactive({
                name: '', category: '', description: '',
                openTime: '', closeTime: '', lat: '', lng: ''
            });

            const errorMessage = ref('');
            const successMessage = ref('');

            let map;
            let marker;

            onMounted(() => {
                const defaultLat = 19.0284;
                const defaultLng = 99.8941;

                map = L.map('map').setView([defaultLat, defaultLng], 15);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                map.on('click', function(e) {
                    const clickedLat = e.latlng.lat.toFixed(6);
                    const clickedLng = e.latlng.lng.toFixed(6);
                    
                    shop.lat = clickedLat;
                    shop.lng = clickedLng;
                    errorMessage.value = '';
                });
            });

            // --- ส่วนที่เพิ่มใหม่: ให้ Vue จับตาดูตัวแปร lat และ lng ตลอดเวลา ---
            watch([() => shop.lat, () => shop.lng], ([newLat, newLng]) => {
                const lat = parseFloat(newLat);
                const lng = parseFloat(newLng);

                // ถ้าตัวเลขถูกต้อง และโหลดแผนที่เสร็จแล้ว
                if (!isNaN(lat) && !isNaN(lng) && map) {
                    if (marker) {
                        map.removeLayer(marker);
                    }
                    marker = L.marker([lat, lng]).addTo(map);
                    map.setView([lat, lng], map.getZoom()); // ขยับแผนที่ตาม
                }
            });

            // ฟังก์ชันตรวจสอบและบันทึกข้อมูล
                  const saveShopProfile = async () => {
                errorMessage.value = '';
                successMessage.value = '';

                // --- เริ่มตรวจจับ Edge Cases ---
                
                // 1. ตรวจสอบว่ากรอกข้อมูลจำเป็นครบไหม (Happy Path ของข้อ 2.1)
                if (!shop.name || !shop.category || !shop.openTime || !shop.closeTime) {
                    errorMessage.value = 'กรุณากรอกข้อมูลที่มีเครื่องหมายดอกจัน (*) ให้ครบถ้วน';
                    window.scrollTo(0, 0); // เลื่อนจอขึ้นไปดู Error
                    return;
                }

                // 2. ตรวจสอบเวลา (Edge Case: ลืมตั้งเวลาปิด หรือ กรอกเวลาเปิดหลังเวลาปิด)
                if (shop.openTime >= shop.closeTime) {
                    errorMessage.value = 'เวลาเปิดร้านต้องอยู่ก่อนเวลาปิดร้านเสมอ และห้ามเป็นเวลาเดียวกัน';
                    window.scrollTo(0, 0);
                    return;
                }

                // 3. ตรวจสอบการปักหมุดแผนที่ (Edge Case ของข้อ 2.2)
                if (!shop.lat || !shop.lng) {
                    errorMessage.value = 'กรุณาคลิกบนแผนที่เพื่อปักหมุดที่ตั้งของร้านคุณ';
                    window.scrollTo(0, 0);
                    return;
                }

                // --- จบการตรวจจับ Edge Cases ---

                // หากผ่านทุกเงื่อนไข (Happy Path)
                successMessage.value = `บันทึกข้อมูลร้าน "${shop.name}" เรียบร้อยแล้ว!`;
                
                // จำลองการหน่วงเวลาแล้วพาไปหน้าหลัก
       // --- จบการตรวจจับ Edge Cases ---

                // แปลงชื่อหมวดหมู่เป็น ID เพื่อให้ตรงกับ Foreign Key ของตาราง Category
                const categoryMap = { "อาหาร": 1, "คาเฟ่": 2, "ซักรีด": 3, "หอพัก": 4, "ซ่อมรถ": 5 };
                const categoryId = categoryMap[shop.category] || 1; 

                try {
                    // ส่งข้อมูลเข้า Supabase ตามโครงสร้างตาราง Shop
                    const { error } = await supabaseClient
                        .from('Shop')
                        .insert([{
                            ShopCategoryId: categoryId,
                            ShopName: shop.name,
                            ShopDescription: shop.description,
                            ShopLocation: `${shop.lat},${shop.lng}`, // รวมพิกัด
                            ShopOperatingNote: `เปิด: ${shop.openTime} - ${shop.closeTime}`,
                            ShopApprovalStatus: 'Pending', // ตั้งค่าสถานะเป็นรออนุมัติ
                            ShopCreatedAt: new Date().toISOString()
                        }]);

                    if (error) {
                        errorMessage.value = 'เกิดข้อผิดพลาดในการบันทึก: ' + error.message;
                        window.scrollTo(0, 0);
                        return;
                    }

                    // หากผ่านทุกเงื่อนไข บันทึกสำเร็จ
                    successMessage.value = `บันทึกข้อมูลร้าน "${shop.name}" เรียบร้อยแล้ว!`;
                    
                    // เอา Comment ออก เพื่อให้เด้งไปหน้า index.html
                    setTimeout(() => {
                        window.location.href = 'index.html'; 
                    }, 2000);

                } catch (err) {
                    errorMessage.value = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
                    window.scrollTo(0, 0);
                }
            }; // ปิดฟังก์ชัน saveShopProfile

            return {
                shop,
                errorMessage,
                successMessage,
                saveShopProfile
            }
        }
    }).mount('#app');
</script>

</body>
</html>
