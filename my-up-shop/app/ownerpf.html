<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการร้านค้า - UP Shops</title>
    
    <!-- โหลด Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- โหลด Leaflet CSS & JS สำหรับแผนที่จริง (ฟรี ไม่ต้องใช้ API Key) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- โหลด Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- นำไปวางต่อจาก <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

<div id="app">
    <!-- Navbar (แบบย่อสำหรับหน้าจัดการ) -->
    <nav class="bg-[#5c2e91] text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center font-bold text-lg">
                <i class="fa-solid fa-shop mr-2 text-[#f1c40f]"></i>
                ระบบจัดการโปรไฟล์ร้านค้า
            </div>
            <a href="index.html" class="text-white hover:text-gray-200 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> กลับหน้าหลัก
            </a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        
        <!-- กล่องแสดงข้อความ Error (Edge Cases) -->
        <div v-if="errorMessage" class="mb-6 p-4 bg-red-100 border-l-4 border-red-500 text-red-700 rounded-r-lg shadow-sm flex items-start">
            <i class="fa-solid fa-triangle-exclamation mt-1 mr-3 text-lg"></i>
            <div>
                <h3 class="font-bold">พบข้อผิดพลาด</h3>
                <p class="text-sm">{{ errorMessage }}</p>
            </div>
        </div>

        <!-- กล่องแสดงข้อความสำเร็จ (Happy Path) -->
        <div v-if="successMessage" class="mb-6 p-4 bg-green-100 border-l-4 border-green-500 text-green-700 rounded-r-lg shadow-sm flex items-start">
            <i class="fa-solid fa-circle-check mt-1 mr-3 text-lg"></i>
            <div>
                <h3 class="font-bold">สำเร็จ!</h3>
                <p class="text-sm">{{ successMessage }}</p>
            </div>
        </div>

        <form @submit.prevent="saveShopProfile" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            
            <!-- ส่วนที่ 1: ข้อมูลพื้นฐาน (User Story 2.1) -->
            <div class="p-6 md:p-8 border-b border-slate-200">
                <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center">
                    <span class="bg-purple-100 text-[#5c2e91] w-8 h-8 rounded-full flex items-center justify-center mr-3 text-sm">1</span>
                    ข้อมูลพื้นฐาน
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อร้านค้า <span class="text-red-500">*</span></label>
                        <input v-model="shop.name" type="text" placeholder="เช่น ป้าศรี ตามสั่ง" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">หมวดหมู่ <span class="text-red-500">*</span></label>
                        <select v-model="shop.category" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                            <option value="" disabled>-- เลือกหมวดหมู่ --</option>
                            <option value="อาหาร">อาหาร</option>
                            <option value="คาเฟ่">คาเฟ่</option>
                            <option value="ซักรีด">ซักรีด</option>
                            <option value="หอพัก">หอพัก</option>
                            <option value="บริการ">บริการ</option>
                        </select>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-1">คำอธิบายร้าน / เมนูแนะนำ</label>
                    <textarea v-model="shop.description" rows="3" placeholder="อธิบายจุดเด่นของร้าน..." class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ราคาประมาณต่อคน (บาท)</label>
                        <input v-model="shop.avgPrice" type="number" min="0" step="any" placeholder="เช่น 50" :class="fieldErrors.avgPrice ? 'border-red-500 ring-1 ring-red-500' : 'border-slate-300'" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                        <p class="text-xs text-slate-400 mt-1">เจ้าของร้านกรอกเองโดยประมาณ (ไม่บังคับ)</p>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-1">เบอร์โทรศัพท์ร้าน <span class="text-red-500">*</span></label>
                    <div v-for="(phone, idx) in phones" :key="idx" class="flex gap-2 mb-2">
                        <input v-model="phones[idx]" type="tel" inputmode="numeric" :placeholder="'เบอร์ที่ ' + (idx + 1) + ' เช่น 0812345678'" :class="fieldErrors.phones ? 'border-red-500 ring-1 ring-red-500' : 'border-slate-300'" class="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                        <button v-if="phones.length > 1" type="button" @click="removePhone(idx)" class="px-4 rounded-lg border border-red-200 text-red-500 hover:bg-red-50 transition" title="ลบเบอร์นี้">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    <button v-if="phones.length < 5" type="button" @click="addPhone" class="mt-1 text-sm font-medium text-[#5c2e91] hover:text-purple-800 transition">
                        <i class="fa-solid fa-plus mr-1"></i> เพิ่มเบอร์
                    </button>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-1">รูปภาพร้านค้า <span class="text-red-500">*</span> <span class="text-xs font-normal text-slate-400">(1–10 รูป, รูปละไม่เกิน 5MB)</span></label>
                    <input type="file" accept="image/*" multiple @change="handleFileUpload" :class="fieldErrors.images ? 'border-red-500 ring-1 ring-red-500' : 'border-slate-300'" class="w-full px-4 py-3 bg-white border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#5c2e91]">
                    <!-- preview ทุกรูป + เลือกปก (ปกมีได้รูปเดียว, default = รูปแรก) -->
                    <div v-if="imageList.length > 0" class="mt-4 grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <div v-for="(img, idx) in imageList" :key="idx" class="relative rounded-lg overflow-hidden border shadow-sm" :class="coverIndex === idx ? 'border-[#5c2e91] ring-2 ring-[#5c2e91]/40' : 'border-slate-200'">
                            <img :src="img.preview" class="h-32 w-full object-cover">
                            <button type="button" @click="removeImage(idx)" class="absolute top-1 right-1 w-7 h-7 rounded-full bg-black/50 hover:bg-black/70 text-white text-xs transition" title="ลบรูปนี้">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                            <label class="absolute bottom-1 left-1 flex items-center gap-1 bg-white/90 rounded-full pl-2 pr-3 py-1 text-xs font-medium cursor-pointer" :class="coverIndex === idx ? 'text-[#5c2e91]' : 'text-slate-500'">
                                <input type="radio" name="cover" :checked="coverIndex === idx" @change="coverIndex = idx" class="accent-[#5c2e91]">
                                {{ coverIndex === idx ? 'ปก' : 'ตั้งเป็นปก' }}
                            </label>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">เวลาเปิด <span class="text-red-500">*</span></label>
                        <input v-model="shop.openTime" type="time" :class="fieldErrors.openTime ? 'border-red-500 ring-1 ring-red-500' : 'border-slate-300'" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">เวลาปิด <span class="text-red-500">*</span></label>
                        <input v-model="shop.closeTime" type="time" :class="fieldErrors.closeTime ? 'border-red-500 ring-1 ring-red-500' : 'border-slate-300'" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 2: พิกัดแผนที่ (User Story 2.2) -->
            <div class="p-6 md:p-8 bg-slate-50">
                <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center">
                    <span class="bg-purple-100 text-[#5c2e91] w-8 h-8 rounded-full flex items-center justify-center mr-3 text-sm">2</span>
                    ตำแหน่งที่ตั้ง (ปักหมุด)
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- แผนที่จริง -->
                    <div class="md:col-span-2 relative border border-slate-300 rounded-xl overflow-hidden h-64 z-10">
                        <!-- กล่องนี้จะถูก Leaflet นำแผนที่มาวาดใส่ -->
                        <div id="map" class="w-full h-full"></div>
                    </div>

                    <!-- ค่าพิกัด -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">ละติจูด (Latitude) <span class="text-red-500">*</span></label>
                            <!-- เปลี่ยนเป็น @input -->
                            <input v-model="shop.lat" type="number" step="any" placeholder="เช่น 19.0284" :class="fieldErrors.lat ? 'border-red-500 ring-1 ring-red-500' : 'border-slate-300'" class="w-full p-3 bg-white border rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">ลองจิจูด (Longitude) <span class="text-red-500">*</span></label>
                            <!-- เปลี่ยนเป็น @input -->
                            <input v-model="shop.lng" type="number" step="any" placeholder="เช่น 99.8941" :class="fieldErrors.lng ? 'border-red-500 ring-1 ring-red-500' : 'border-slate-300'" class="w-full p-3 bg-white border rounded-lg focus:ring-2 focus:ring-[#5c2e91] focus:outline-none">
                        </div>
                        <div class="text-xs text-slate-500 mt-2">
                            <i class="fa-solid fa-circle-info mr-1"></i> จำเป็นต้องปักหมุด โดยคลิกบนแผนที่ หรือพิมพ์ตัวเลขพิกัดเอง
                        </div>
                    </div>
                </div>
            </div>

            <!-- ปุ่ม Submit -->
            <div class="p-6 border-t border-slate-200 bg-white flex justify-end">
                <button type="submit" class="bg-[#5c2e91] hover:bg-purple-800 text-white font-bold py-3 px-8 rounded-lg shadow-md transition duration-200 flex items-center">
                    <i class="fa-solid fa-save mr-2"></i> บันทึกข้อมูลร้านค้า
                </button>
            </div>
            
        </form>
    </main>
</div>

<script>
    // เพิ่ม watch เข้ามาตรงนี้
    // ดึง Key มาจากหน้า login.html ของคุณ
    // ดึง Key มาจากหน้า login.html ของคุณ
    const supabaseUrl = 'https://kmebinvqehwomycufvlj.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttZWJpbnZxZWh3b215Y3VmdmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDc5ODMsImV4cCI6MjEwMjc4Mzk4M30.TWGUBnYcoBovJ34q1hhV-yJ8vV-e2sG3tECXOH-HEs4';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    const { createApp, reactive, ref, onMounted, watch } = Vue; 

    createApp({
        setup() {
            const shop = reactive({
                name: '', category: '', description: '', avgPrice: '',
                openTime: '', closeTime: '', lat: '', lng: ''
            });
            const phones = ref(['']);

            const addPhone = () => {
                if (phones.value.length < 5) phones.value.push('');
            };
            const removePhone = (idx) => {
                if (phones.value.length > 1) phones.value.splice(idx, 1);
            };
            const normalizePhone = (p) => String(p || '').replace(/[\s-]/g, '');

            const errorMessage = ref('');
            const successMessage = ref('');
            const fieldErrors = reactive({ openTime: false, closeTime: false, lat: false, lng: false, avgPrice: false, phones: false, images: false });

            const resetFieldErrors = () => {
                fieldErrors.openTime = false;
                fieldErrors.closeTime = false;
                fieldErrors.lat = false;
                fieldErrors.lng = false;
                fieldErrors.avgPrice = false;
                fieldErrors.phones = false;
                fieldErrors.images = false;
            };

            const failValidation = (message) => {
                errorMessage.value = message;
                successMessage.value = '';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            let map;
            let marker;

            onMounted(() => {
                const defaultLat = 19.0284;
                const defaultLng = 99.8941;

                map = L.map('map').setView([defaultLat, defaultLng], 15);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                map.on('click', function(e) {
                    const clickedLat = e.latlng.lat.toFixed(6);
                    const clickedLng = e.latlng.lng.toFixed(6);
                    
                    shop.lat = clickedLat;
                    shop.lng = clickedLng;
                    fieldErrors.lat = false;
                    fieldErrors.lng = false;
                    errorMessage.value = '';
                });
            });

            watch([() => shop.lat, () => shop.lng], ([newLat, newLng]) => {
                const lat = parseFloat(newLat);
                const lng = parseFloat(newLng);

                if (!isNaN(lat) && !isNaN(lng) && map) {
                    if (marker) {
                        map.removeLayer(marker);
                    }
                    marker = L.marker([lat, lng]).addTo(map);
                    map.setView([lat, lng], map.getZoom()); 
                }
            });

            const MAX_IMAGES = 10;
            const MAX_IMAGE_SIZE = 5 * 1024 * 1024; // 5MB ต่อรูป
            const imageList = ref([]); // [{ file, preview }]
            const coverIndex = ref(0);

            const handleFileUpload = (event) => {
                const files = Array.from(event.target.files || []);
                // รีเซ็ต input ให้เลือกไฟล์เดิมซ้ำได้
                event.target.value = '';
                files.forEach((file) => {
                    if (imageList.value.length >= MAX_IMAGES) {
                        errorMessage.value = `เลือกรูปได้สูงสุด ${MAX_IMAGES} รูป`;
                        return;
                    }
                    if (!file.type.startsWith('image/')) {
                        errorMessage.value = `ไฟล์ "${file.name}" ไม่ใช่รูปภาพ`;
                        return;
                    }
                    if (file.size > MAX_IMAGE_SIZE) {
                        errorMessage.value = `ไฟล์ "${file.name}" ใหญ่เกิน 5MB`;
                        return;
                    }
                    imageList.value.push({ file, preview: URL.createObjectURL(file) });
                });
                if (imageList.value.length > 0) {
                    fieldErrors.images = false;
                    if (coverIndex.value >= imageList.value.length) coverIndex.value = 0;
                }
            };

            const removeImage = (idx) => {
                const removed = imageList.value.splice(idx, 1)[0];
                if (removed) URL.revokeObjectURL(removed.preview);
                // ถ้าลบรูปที่เป็นปก ปกย้ายไปรูปแรกที่เหลืออัตโนมัติ
                if (coverIndex.value >= imageList.value.length) coverIndex.value = 0;
            };

            const saveShopProfile = async () => {
                errorMessage.value = '';
                successMessage.value = ''; // เคลียร์ข้อความสำเร็จเก่า
                resetFieldErrors();
                
                if (!shop.name || !shop.category) { 
                    failValidation('กรุณากรอกข้อมูลสำคัญให้ครบถ้วน');
                    return; 
                }

                // ราคาประมาณ (optional): ถ้ากรอกต้องเป็นตัวเลข ≥ 0
                const avgPriceText = String(shop.avgPrice ?? '').trim();
                let avgPriceValue = null;
                if (avgPriceText !== '') {
                    avgPriceValue = Number(avgPriceText);
                    if (!Number.isFinite(avgPriceValue) || avgPriceValue < 0) {
                        fieldErrors.avgPrice = true;
                        failValidation('ราคาประมาณต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป');
                        return;
                    }
                }

                // เบอร์โทร: อย่างน้อย 1 เบอร์, ขึ้นต้น 0 รวม 9-10 หลัก, ห้ามซ้ำ
                const phoneList = phones.value.map(normalizePhone).filter(p => p !== '');
                if (phoneList.length === 0) {
                    fieldErrors.phones = true;
                    failValidation('กรุณากรอกเบอร์โทรศัพท์ร้านอย่างน้อย 1 เบอร์');
                    return;
                }
                const badPhone = phoneList.find(p => !/^0\d{8,9}$/.test(p));
                if (badPhone) {
                    fieldErrors.phones = true;
                    failValidation(`เบอร์ "${badPhone}" ไม่ถูกต้อง (ต้องขึ้นต้นด้วย 0 รวม 9-10 หลัก)`);
                    return;
                }
                if (new Set(phoneList).size !== phoneList.length) {
                    fieldErrors.phones = true;
                    failValidation('มีเบอร์โทรซ้ำกัน กรุณาตรวจสอบ');
                    return;
                }

                // รูปภาพ: บังคับ 1–10 รูป (ชนิด/ขนาดเช็คตอนเลือกไฟล์แล้ว เหลือเช็คจำนวนตรงนี้)
                if (imageList.value.length === 0) {
                    fieldErrors.images = true;
                    failValidation('กรุณาเลือกรูปภาพร้านอย่างน้อย 1 รูป');
                    return;
                }
                if (imageList.value.length > MAX_IMAGES) {
                    fieldErrors.images = true;
                    failValidation(`เลือกรูปได้สูงสุด ${MAX_IMAGES} รูป`);
                    return;
                }

                if (!shop.openTime || !shop.closeTime) {
                    fieldErrors.openTime = !shop.openTime;
                    fieldErrors.closeTime = !shop.closeTime;
                    failValidation('กรุณาระบุเวลาเปิดและเวลาปิดของร้าน');
                    return;
                }

                const latText = String(shop.lat ?? '').trim();
                const lngText = String(shop.lng ?? '').trim();
                if (!latText || !lngText) {
                    fieldErrors.lat = !latText;
                    fieldErrors.lng = !lngText;
                    failValidation('กรุณาระบุตำแหน่งที่ตั้ง โดยคลิกปักหมุดบนแผนที่หรือกรอกพิกัด');
                    return;
                }

                const lat = parseFloat(latText);
                const lng = parseFloat(lngText);
                if (isNaN(lat) || isNaN(lng)) {
                    fieldErrors.lat = isNaN(lat);
                    fieldErrors.lng = isNaN(lng);
                    failValidation('พิกัดไม่ถูกต้อง กรุณากรอกเป็นตัวเลขเท่านั้น');
                    return;
                }
                if (lat < -90 || lat > 90 || lng < -180 || lng > 180) {
                    fieldErrors.lat = lat < -90 || lat > 90;
                    fieldErrors.lng = lng < -180 || lng > 180;
                    failValidation('พิกัดอยู่นอกขอบเขตที่ถูกต้อง (ละติจูด -90 ถึง 90, ลองจิจูด -180 ถึง 180)');
                    return;
                }

                try {
                    // แปลงหมวดหมู่เป็นตัวเลขให้ตรงกับที่สร้างไว้ใน Database
                    let categoryId = 1;
                    if (shop.category === 'คาเฟ่') categoryId = 2;
                    else if (shop.category === 'ซักรีด') categoryId = 3;
                    else if (shop.category === 'หอพัก') categoryId = 4;
                    else if (shop.category === 'บริการ') categoryId = 5;

                    // 1. บันทึกแค่ข้อมูล Text ลงตาราง Shop เท่านั้น (ปิดระบบรูปไว้ก่อน)
                    const { data: shopData, error: shopError } = await supabaseClient
                        .from('Shop')
                        .insert([{
                            ShopName: shop.name,
                            ShopDescription: shop.description,
                            ShopCategoryId: categoryId, 
                            ShopAvgPrice: avgPriceValue,
                            ShopLocation: `${lat},${lng}`,
                            ShopOperatingNote: `${shop.openTime} - ${shop.closeTime}`,
                            ShopApprovalStatus: 'Pending'
                        }])
                        .select(); 

                    if (shopError) throw shopError;
                    const newShopId = shopData?.[0]?.ShopID ?? null;

                    // 2. บันทึกเบอร์โทรทุกลงตาราง ShopPhoneNumber
                    if (newShopId !== null) {
                        const { error: phoneError } = await supabaseClient
                            .from('ShopPhoneNumber')
                            .insert(phoneList.map(p => ({ ShopID: newShopId, ShopPhoneNumber: p })));
                        if (phoneError) throw new Error('สร้างร้านแล้ว แต่บันทึกเบอร์โทรไม่สำเร็จ: ' + phoneError.message);
                    }

                    // ผูกเจ้าของกับร้าน: อัปเดท UserShopID (FK) ในแถว User ของคนกดบันทึกเป็น ID ร้านที่เพิ่งสร้าง
                    // ล้มเหลวไม่บล็อกการสร้างร้าน แต่ต้องแจ้งให้เห็น (ไม่ใช่แค่ warn ใน console)
                    let linkWarning = '';
                    try {
                        if (newShopId !== null) {
                            const { data: userData } = await supabaseClient.auth.getUser();
                            const email = userData?.user?.email || localStorage.getItem('userEmail');
                            if (!email) {
                                linkWarning = 'ไม่พบอีเมลผู้ใช้ เลยผูกเจ้าของร้านไม่ได้';
                            } else {
                                // verify ว่า DB ผูกจริง (RLS ที่ไม่มี UPDATE จะสำเร็จหลอกโดยได้ 0 แถว)
                                const { data: linked, error: linkError } = await supabaseClient
                                    .from('User')
                                    .update({ UserShopID: newShopId })
                                    .eq('UserEmail', email)
                                    .select('UserID');
                                if (linkError) throw linkError;
                                if (!linked || linked.length === 0) {
                                    linkWarning = 'DB ไม่ได้ผูกเจ้าของ (0 แถว) — ตรวจ RLS UPDATE ของตาราง User';
                                }
                            }
                        }
                    } catch (linkErr) {
                        console.warn('Link shop to owner failed:', linkErr);
                        linkWarning = 'ผูกเจ้าของร้านไม่สำเร็จ: ' + (linkErr.message || '');
                    }

                    // 3. อัปโหลดรูปขึ้น Storage bucket shop-images แล้วบันทึกแถวลงตาราง Shop_Image
                    // (ปกมีรูปเดียว: ตาม radio coverIndex, default = รูปแรก) — ล้มเหลวไม่บล็อก แต่ต้องแจ้งให้เห็น
                    let imageWarning = '';
                    if (newShopId !== null) {
                        try {
                            const uploadedUrls = [];
                            for (let i = 0; i < imageList.value.length; i++) {
                                const file = imageList.value[i].file;
                                const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
                                const path = `${newShopId}/${Date.now()}-${i}.${ext}`;
                                const { error: uploadError } = await supabaseClient.storage
                                    .from('shop-images')
                                    .upload(path, file, { contentType: file.type, upsert: false });
                                if (uploadError) throw new Error(`อัปโหลดรูปที่ ${i + 1} ไม่สำเร็จ: ` + uploadError.message);
                                const { data: urlData } = supabaseClient.storage.from('shop-images').getPublicUrl(path);
                                uploadedUrls.push(urlData.publicUrl);
                            }
                            const { error: imageError } = await supabaseClient
                                .from('Shop_Image')
                                .insert(uploadedUrls.map((url, i) => ({
                                    ShopID: newShopId,
                                    ShopImageNo: i + 1,
                                    ShopImageURL: url,
                                    ShopIsCover: i === coverIndex.value
                                })));
                            if (imageError) throw new Error('อัปโหลดรูปแล้ว แต่บันทึกลงตารางไม่สำเร็จ: ' + imageError.message);
                        } catch (imgErr) {
                            console.warn('Shop image upload failed:', imgErr);
                            imageWarning = 'อัปโหลดรูปไม่สำเร็จ: ' + (imgErr.message || '');
                        }
                    }

                    // แสดงกล่องข้อความสีเขียว (ถ้าผูกเจ้าของ/อัปโหลดรูปไม่สำเร็จให้บอกต่อท้ายด้วย)
                    const warnings = [linkWarning, imageWarning].filter(w => w).map(w => `แต่${w}`).join(' ');
                    successMessage.value = warnings
                        ? `ข้อมูลร้านค้าเข้าสู่ระบบเรียบร้อยแล้ว! (${warnings})`
                        : 'ข้อมูลร้านค้าเข้าสู่ระบบเรียบร้อยแล้ว!';
                    
                    // ปิดการเด้งไปหน้า index ชั่วคราว จะได้เห็นว่ามันทำงานสำเร็จจริงๆ
                    // window.location.href = 'index.html'; 

                } catch (err) {
                    console.error('Error saving shop:', err);
                    errorMessage.value = 'เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + err.message;
                }
            };

            // *** สำคัญมาก: ต้อง return ตัวแปรเหล่านี้ออกไปให้ HTML ใช้ด้วย ***
            return {
                shop,
                phones,
                addPhone,
                removePhone,
                errorMessage,
                successMessage,
                fieldErrors,
                saveShopProfile,
                handleFileUpload,
                imageList,
                coverIndex,
                removeImage
            }
        }
    }).mount('#app');
</script>

</body>
</html>
